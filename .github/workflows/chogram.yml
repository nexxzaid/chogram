name: Chogram

on:
  push:
    branches: [ chogram ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "XCODE_VERSION=$XCODE_VERSION" >> $GITHUB_ENV
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Free disk space
        run: |
          df -h /
          for path in /Applications/Xcode_*; do
            if [ "$(readlink -f "$path")" != "$(readlink -f /Applications/Xcode_$XCODE_VERSION.app)" ]; then
              sudo rm -rf "$path"
            fi
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/android-sdk
          df -h /

      - name: Create build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Add TELEGRAM_API_ID and TELEGRAM_API_HASH to the repository secrets"
            exit 1
          fi
          mkdir -p build-input
          python3 - <<'EOF'
          import json, os
          with open('build-system/chogram-configuration.json') as file:
              configuration = json.load(file)
          configuration['api_id'] = os.environ['TELEGRAM_API_ID']
          configuration['api_hash'] = os.environ['TELEGRAM_API_HASH']
          with open('build-input/chogram-configuration.json', 'w') as file:
              json.dump(configuration, file)
          EOF

      - name: Restore bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ env.XCODE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bazel-${{ env.XCODE_VERSION }}-

      - name: Build the App
        run: |
          set -x

          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER=$(($(cat build_number_offset) + $GITHUB_RUN_NUMBER))
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/chogram-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-input/chogram-configuration.json \
            --codesigningInformationPath=build-system/chogram-codesigning \
            --configuration=release_arm64 \
            --disableExtensions \
            --continueOnError \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

          mv build/artifacts/Telegram.ipa build/artifacts/Chogram.ipa

      - name: Add proxy to the IPA
        env:
          CHOGRAM_PROXY_SECRET: ${{ secrets.CHOGRAM_PROXY_SECRET }}
        run: |
          if [ -z "$CHOGRAM_PROXY_SECRET" ]; then
            echo "::warning::CHOGRAM_PROXY_SECRET is not set, building without a proxy"
            exit 0
          fi
          mkdir build/ipa
          unzip -q build/artifacts/Chogram.ipa -d build/ipa
          plutil -insert ChogramProxySecret -string "$CHOGRAM_PROXY_SECRET" build/ipa/Payload/*.app/Info.plist
          rm build/artifacts/Chogram.ipa
          (cd build/ipa && zip -qry ../artifacts/Chogram.ipa .)
          rm -rf build/ipa

      - name: Save bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ env.XCODE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A draft is visible only to people with write access, and the IPA holds the proxy secret.
          gh release create "build-$BUILD_NUMBER" build/artifacts/Chogram.ipa \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Chogram $APP_VERSION ($BUILD_NUMBER)" \
            --notes "Unsigned build of Chogram $APP_VERSION ($BUILD_NUMBER) for installing through AltStore."
