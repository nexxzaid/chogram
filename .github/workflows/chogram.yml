name: Chogram

on:
  push:
    branches: [ chogram ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set active Xcode path
        run: |
          ls -d /Applications/Xcode* || true
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          # The runner image may ship a newer point release than versions.json names; use the
          # newest Xcode of the same major version then, and let Make.py accept it.
          if [ ! -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            MAJOR=${XCODE_VERSION%%.*}
            FOUND=$(ls -d /Applications/Xcode_${MAJOR}*.app 2>/dev/null | sort -V | tail -1)
            if [ -z "$FOUND" ]; then
              echo "::error::No Xcode $MAJOR on this runner"
              exit 1
            fi
            XCODE_VERSION=$(basename "$FOUND" .app | sed 's/^Xcode_//')
            echo "OVERRIDE_XCODE=--overrideXcodeVersion" >> $GITHUB_ENV
          fi
          echo "XCODE_VERSION=$XCODE_VERSION" >> $GITHUB_ENV
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version

      - name: Free disk space
        run: |
          df -h /
          for path in /Applications/Xcode_*; do
            if [ "$(readlink -f "$path")" != "$(readlink -f /Applications/Xcode_$XCODE_VERSION.app)" ]; then
              sudo rm -rf "$path"
            fi
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/android-sdk
          df -h /

      - name: Create build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Add TELEGRAM_API_ID and TELEGRAM_API_HASH to the repository secrets"
            exit 1
          fi
          mkdir -p build-input
          python3 - <<'EOF'
          import json, os
          with open('build-system/chogram-configuration.json') as file:
              configuration = json.load(file)
          configuration['api_id'] = os.environ['TELEGRAM_API_ID']
          configuration['api_hash'] = os.environ['TELEGRAM_API_HASH']
          with open('build-input/chogram-configuration.json', 'w') as file:
              json.dump(configuration, file)
          EOF

      - name: Restore bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ env.XCODE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bazel-${{ env.XCODE_VERSION }}-

      - name: Build the App
        run: |
          set -x

          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER=$(($(cat build_number_offset) + $GITHUB_RUN_NUMBER))
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/chogram-codesigning/certs
          python3 -u build-system/Make/Make.py $OVERRIDE_XCODE \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-input/chogram-configuration.json \
            --codesigningInformationPath=build-system/chogram-codesigning \
            --configuration=release_arm64 \
            --disableExtensions \
            --continueOnError \
            --enableParallelSwiftmoduleGeneration \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

          mv build/artifacts/Telegram.ipa build/artifacts/Chogram.ipa

      - name: Save bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ env.XCODE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes show up in SideStore and in the app's "Что нового". They come from
          # .github/release-notes.md when it lists this build's changes, otherwise from the
          # commit titles since the previous release.
          if [ -s .github/release-notes.md ]; then
            cp .github/release-notes.md release-notes.txt
          else
            PREV=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')
            if [ -n "$PREV" ]; then
              gh api "repos/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_SHA" \
                --jq '.commits[].commit.message | split("\n")[0]' | grep -v '\[skip ci\]' | sed 's/^/• /' > release-notes.txt || true
            fi
            [ -s release-notes.txt ] || echo "Исправления и улучшения." > release-notes.txt
          fi
          # Builds from any branch but chogram are test builds: marked as pre-releases, which the
          # SideStore source and the in-app update banner skip.
          PRERELEASE=""
          if [ "$GITHUB_REF_NAME" != "chogram" ]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "build-$BUILD_NUMBER" build/artifacts/Chogram.ipa $PRERELEASE \
            --target "$GITHUB_SHA" \
            --title "Chogram $APP_VERSION ($BUILD_NUMBER)" \
            --notes-file release-notes.txt
